<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="darDia()">Fecha Actual</button>
    <p id="texto"></p>
    
    <script>
        function darDia(){
            var dia = new Date();
            var semanas = ["Domingo", "Lunes", "Martes", "Miercoles", "Jueves", "Viernes", "Sabado"];
            var meses = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
            document.getElementById("texto").innerText = semanas[dia.getDay()] + ", " + dia.getDate() + " de " + meses[dia.getMonth()] + " de " + dia.getFullYear();
    }
    </script>
</body>
</html>
