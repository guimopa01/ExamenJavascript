<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="abrirVentana()">Abrir Ventana</button>
    
    <script>
        var ventana;

        function abrirVentana() {
            ventana = window.open("", "ventana", "width=400,height=400");

            ventana.document.write("<button onclick='window.close()'>Cerrar Ventana</button>");
        }

    </script>
</body>
</html>
