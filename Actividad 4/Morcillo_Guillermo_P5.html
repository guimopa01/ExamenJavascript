<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="text/javascript">

    let cajaTexto;

        document.addEventListener("DOMContentLoaded", function() {

    cajaTexto = document.getElementById("cajaTexto");

    let caja = document.createElement("input");

    caja.setAttribute("type", "text");
    caja.setAttribute("id", "caja");
    caja.setAttribute("placeholder", "Escribe algo...");

    caja.style.width = "300px";
    caja.style.height = "30px";
    caja.style.border = "1px solid #ccc";
    caja.style.borderRadius = "5px";
    caja.style.padding = "5px";
    caja.style.backgroundColor = "#f9f9f9";

    cajaTexto.appendChild(caja);
    
    });

  


    </script>
    <title>Document</title>
</head>
<body>
        <div id="cajaTexto">

        </div>

</body>
</html>
