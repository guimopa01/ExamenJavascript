<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="text/javascript">

    let div;
    let parrafos;

        document.addEventListener("DOMContentLoaded", function() {

    div = document.getElementById("divisor");
    parrafos = div.getElementsByTagName("p");

    });

function addParrafo(){

    let texto = document.createTextNode('Parrafo añadido');
    let parrafo = document.createElement("p");

    parrafo.appendChild(texto);
    div.appendChild(parrafo);
}

function insertarParrafo(){
   
    let parrafo = document.createElement("p");

    parrafo.textContent = "Párrafo insertado";
    div.insertBefore(parrafo, parrafos[0]);
}

function reemplazarParrafo(){
    let texto = document.createTextNode("Párrafo reemplazado");
    let parrafo = document.createElement("p");
    parrafo.appendChild(texto);
    div.replaceChild(parrafo, parrafos[0]);
}

function borrarParrafo(){
    div.removeChild(parrafos[0]);
}

function clonarDiv(){
    let clonar = div.cloneNode(true);
    document.body.appendChild(clonar);
}

    </script>
    <title>Document</title>
</head>
<body>
    <div id="divisor">
        <p>Este es mi primer párrafo</p>

    </div>
    
        <button onclick="addParrafo()">Añadir párrafo</button>
        <button onclick="insertarParrafo()">Insertar párrafo</button>
        <button onclick="reemplazarParrafo()">Reemplazar párrafo</button>
        <button onclick="borrarParrafo()">Borrar párrafo</button>
        <button onclick="clonarDiv()">Clonar div</button>
</body>
</html>
