<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar color del texto</title>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            let colors = document.getElementById("colores");
            let texto = document.getElementById("parrafo");

            colors.addEventListener("change", function () {
                texto.style.color = colors.value;
            });

            texto.style.color = colors.value;
        });
    </script>
</head>
<body>
    <label for="colores">Elige un color:</label>
    <select id="colores" name="colores">
        <option value="blue">Azul</option>
        <option value="green">Verde</option>
        <option value="red">Rojo</option>
    </select>

    <p id="parrafo">Este párrafo cambiará de color con la opción seleccionada del cuadro de lista</p>
</body>
</html>
