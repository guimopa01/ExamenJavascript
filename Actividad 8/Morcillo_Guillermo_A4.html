<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar color del texto</title>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            let neg = document.getElementById("negrita");
            let cur = document.getElementById("cursiva");
            let parrafo = document.getElementById("parrafo");

            neg.addEventListener("change", function () {
                if (neg.checked) {
                    parrafo.style.fontWeight = "bold";
                } else {
                    parrafo.style.fontWeight = "normal";
                }
            });

            cur.addEventListener("change", function () {
                if (cur.checked) {
                    parrafo.style.fontStyle = "italic";
                } else {
                    parrafo.style.fontStyle = "normal";
                }
            });

        });
    </script>
</head>
<body>

    <input type="checkbox" id="negrita" name="negrita" value="negrita">
        <label for="negrita">Negrita</label><br>

    <input type="checkbox" id="cursiva" name="cursiva" value="cursiva">
        <label for="cursiva">Cursiva</label><br>

    <p id="parrafo">Este párrafo cambiará de estilo con la opción seleccionada de los checkboxes</p>
</body>
</html>
