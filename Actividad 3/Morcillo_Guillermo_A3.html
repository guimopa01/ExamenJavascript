<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="number" id="numero" placeholder="0" value="0">

    <button onclick="sumar()">Sumar 10</button>

    <button onclick="reiniciar()">Inicializar</button>

    <script>

        function sumar() {
            let numero = document.getElementById("numero");
            numero.value = parseInt(numero.value) + 10;
        }

        function reiniciar() {
            let numero = document.getElementById("numero");
            numero.value = 0;
        }
    </script>
</body>
</html>
