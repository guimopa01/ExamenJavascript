<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <p></p>

    <script>
        let tiempo = 20000;
        function cambiarPagina(){   
            let texto = document.querySelector("p");
            texto.textContent = "Bienvenido a mi pagina";
                }
        setTimeout(cambiarPagina, tiempo);
    </script>
</body>
</html>
