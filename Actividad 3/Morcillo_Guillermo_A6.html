<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="resultado"></p>
    <script>
        let valor = "2+2"
        let resultado = eval(valor);
        document.getElementById("resultado").textContent = 
        "Resultado de  " + valor + " es: " + resultado;
    </script>
</body>
</html>
