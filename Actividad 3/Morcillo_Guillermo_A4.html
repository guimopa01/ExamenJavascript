<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <label for="numero">Introduce un número del 1-10:</label>
    <input type="number" id="numero" placeholder="0">

    <button onclick="comprobacion()">Comprobar</button>

    <p id="resultado"></p>

    <script>
        function comprobacion() {
            let num = parseInt(document.getElementById("numero").value);
            let resultado = document.getElementById("resultado");
            let valor = Math.floor(Math.random() * 10) + 1;

            resultado.innerText = (num == valor) ? "Ganaste" : "Perdiste el numero era " + valor;
        }
    </script>
</body>
</html>
